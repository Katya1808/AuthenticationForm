[pytest]
# Указываем, где лежат настройки Django
DJANGO_SETTINGS_MODULE = auth_project.settings

# Явно говорим pytest искать файлы с именем tests.py
python_files = tests.py test_*.py *_tests.py

# Говорим искать классы, начинающиеся с Test
python_classes = Test*

# Говорим искать функции, начинающиеся с test_
python_functions = test_*

# Делаем вывод более подробным
addopts = -v --tb=short