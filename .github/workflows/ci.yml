name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Устанавливаем зависимости
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-django pytest-cov django

      # 4. Проверка синтаксиса через flake8
      - name: Lint with flake8
        run: |
          # Останавливаем сборку, если есть ошибки стиля
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Показываем предупреждения, но не ломаем сборку
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      # 5. Запуск тестов с покрытием
      - name: Run tests with coverage
        run: |
          cd auth_project
          pytest --cov=users --cov-report=term-missing --cov-report=xml

      # 6. Загрузка отчёта о покрытии (опционально)
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: auth_project/coverage.xml