<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Auth Project{% endblock %}</title>
</head>
<body>
    <nav>
        <ul>
        <li><a href="{% url 'home' %}">Home</a></li>
           {% if user.is_authenticated %}
        <!-- Если пользователь вошел, показываем его имя и кнопку выхода -->
        <div>Привет, <strong>{{ user.username }}</strong>!</div>
        <a href="{% url 'logout' %}" style="color: red;">Выйти из аккаунта</a>
    {% else %}
        <!-- Если пользователь не вошел, предлагаем войти -->
        <p>Вы не авторизованы.</p>
        <a href="{% url 'login' %}">Войти</a>
    {% endif %}
        </ul>
    </nav>

    {% block content %}
    {% endblock %}

    {% block extra_js %}
    {% endblock %}
</body>
</html>
